version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errorlint
    - gosec
    - noctx
    - bodyclose
    - misspell
    - unconvert
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests may use throwaway permissions and paths.
      - path: _test\.go
        linters:
          - gosec
      # Test support code: it re-executes the test binary and writes temp files.
      - path: internal/provider/providertest/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
